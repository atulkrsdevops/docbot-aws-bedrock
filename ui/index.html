<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocBot — RAG Chatbot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --surface2: #1e2128;
    --border: #2a2d35;
    --accent: #4ade80;
    --accent-dim: rgba(74,222,128,0.12);
    --accent-glow: rgba(74,222,128,0.25);
    --text: #e8eaf0;
    --text-muted: #6b7080;
    --text-dim: #9499a8;
    --user-bg: #1a2a1f;
    --user-border: #2d4a35;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Top bar */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .logo-dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent-glow);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  .config-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .config-input {
    font-family: var(--mono);
    font-size: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 10px;
    border-radius: 6px;
    width: 340px;
    outline: none;
    transition: border-color 0.2s, color 0.2s;
  }

  .config-input:focus {
    border-color: var(--accent);
    color: var(--text);
  }

  .config-input::placeholder { color: var(--text-muted); }

  .status-badge {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    background: var(--surface2);
    transition: all 0.3s;
  }

  .status-badge.connected {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  /* Messages area */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 32px 0;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg-row {
    display: flex;
    padding: 0 24px;
    margin-bottom: 24px;
    gap: 14px;
    animation: fadein 0.25s ease;
  }

  @keyframes fadein {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .avatar.bot {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: var(--accent);
  }

  .avatar.user-av {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text-muted);
  }

  .bubble {
    max-width: 640px;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.65;
    font-weight: 300;
  }

  .bubble.bot {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top-left-radius: 3px;
    color: var(--text);
  }

  .bubble.user {
    background: var(--user-bg);
    border: 1px solid var(--user-border);
    border-top-right-radius: 3px;
    color: var(--text);
  }

  .sources {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .source-tag {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid rgba(74,222,128,0.2);
    padding: 2px 8px;
    border-radius: 4px;
    word-break: break-all;
  }

  .chunks-note {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    font-family: var(--mono);
  }

  /* Thinking indicator */
  .thinking {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 16px 18px;
  }

  .thinking span {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.2s ease-in-out infinite;
    opacity: 0.4;
  }

  .thinking span:nth-child(2) { animation-delay: 0.18s; }
  .thinking span:nth-child(3) { animation-delay: 0.36s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* Empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 16px;
    opacity: 0.5;
    text-align: center;
    padding: 24px;
  }

  .empty-state .big-dot {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .empty-state .big-dot::after {
    content: '';
    width: 14px; height: 14px;
    background: var(--accent);
    border-radius: 50%;
  }

  .empty-state p {
    font-size: 13px;
    color: var(--text-muted);
    font-family: var(--mono);
  }

  /* Input area */
  footer {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #query-input {
    flex: 1;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 300;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 10px;
    resize: none;
    outline: none;
    min-height: 48px;
    max-height: 140px;
    line-height: 1.5;
    transition: border-color 0.2s;
  }

  #query-input:focus { border-color: var(--accent); }
  #query-input::placeholder { color: var(--text-muted); }

  #send-btn {
    background: var(--accent);
    border: none;
    color: #0a0f0c;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    padding: 12px 20px;
    border-radius: 10px;
    cursor: pointer;
    height: 48px;
    white-space: nowrap;
    transition: opacity 0.15s, transform 0.1s;
    flex-shrink: 0;
  }

  #send-btn:hover { opacity: 0.88; }
  #send-btn:active { transform: scale(0.97); }
  #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .hint {
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--mono);
  }

  .error-bubble {
    color: #f87171;
    font-family: var(--mono);
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    DocBot
  </div>
  <div class="config-row">
    <input
      id="api-url"
      class="config-input"
      type="text"
      placeholder="Paste your API Gateway URL here..."
      value=""
    />
    <div class="status-badge" id="status">not connected</div>
  </div>
</header>

<div id="messages">
  <div class="empty-state" id="empty-state">
    <div class="big-dot"></div>
    <p>Paste your API Gateway URL above, then ask anything<br>about your uploaded documents.</p>
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea
      id="query-input"
      rows="1"
      placeholder="Ask a question about your documents..."
      maxlength="2000"
    ></textarea>
    <button id="send-btn">Send ↵</button>
  </div>
  <div class="hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</div>
</footer>

<script>
  const messagesEl = document.getElementById('messages');
  const emptyState = document.getElementById('empty-state');
  const queryInput = document.getElementById('query-input');
  const sendBtn = document.getElementById('send-btn');
  const apiUrlInput = document.getElementById('api-url');
  const statusBadge = document.getElementById('status');

  // Auto-resize textarea
  queryInput.addEventListener('input', () => {
    queryInput.style.height = 'auto';
    queryInput.style.height = Math.min(queryInput.scrollHeight, 140) + 'px';
  });

  // Update status badge on URL change
  apiUrlInput.addEventListener('input', () => {
    const url = apiUrlInput.value.trim();
    if (url.startsWith('https://') && url.includes('execute-api')) {
      statusBadge.textContent = 'connected';
      statusBadge.classList.add('connected');
    } else {
      statusBadge.textContent = 'not connected';
      statusBadge.classList.remove('connected');
    }
  });

  // Send on Enter (not Shift+Enter)
  queryInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);

  function getApiUrl() {
    let url = apiUrlInput.value.trim().rstrip?.('/') ?? apiUrlInput.value.trim();
    return url.replace(/\/+$/, '') + '/chat';
  }

  function appendMessage(role, html, extras = null) {
    emptyState.style.display = 'none';

    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const av = document.createElement('div');
    av.className = `avatar ${role === 'user' ? 'user-av' : 'bot'}`;
    av.textContent = role === 'user' ? 'You' : 'DB';

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role === 'user' ? 'user' : 'bot'}`;
    bubble.innerHTML = html;

    if (extras && extras.sources && extras.sources.length > 0) {
      const srcDiv = document.createElement('div');
      srcDiv.className = 'sources';
      extras.sources.forEach(s => {
        const tag = document.createElement('span');
        tag.className = 'source-tag';
        const name = s.split('/').pop() || s;
        tag.textContent = name;
        tag.title = s;
        srcDiv.appendChild(tag);
      });
      bubble.appendChild(srcDiv);

      if (extras.chunks_retrieved) {
        const note = document.createElement('div');
        note.className = 'chunks-note';
        note.textContent = `${extras.chunks_retrieved} chunks retrieved`;
        bubble.appendChild(note);
      }
    }

    row.appendChild(av);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function appendThinking() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'thinking-row';
    row.innerHTML = `
      <div class="avatar bot">DB</div>
      <div class="bubble bot">
        <div class="thinking">
          <span></span><span></span><span></span>
        </div>
      </div>
    `;
    emptyState.style.display = 'none';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeThinking() {
    const el = document.getElementById('thinking-row');
    if (el) el.remove();
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\n/g, '<br>');
  }

  async function sendMessage() {
    const query = queryInput.value.trim();
    if (!query) return;

    const apiBase = apiUrlInput.value.trim().replace(/\/+$/, '');
    if (!apiBase) {
      alert('Please paste your API Gateway URL first.');
      return;
    }

    appendMessage('user', escapeHtml(query));
    queryInput.value = '';
    queryInput.style.height = 'auto';
    sendBtn.disabled = true;
    appendThinking();

    try {
      const res = await fetch(`${apiBase}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query }),
      });

      const data = await res.json();
      removeThinking();

      if (!res.ok) {
        appendMessage('bot', `<span class="error-bubble">Error ${res.status}: ${data.error || 'Unknown error'}</span>`);
      } else {
        appendMessage('bot', escapeHtml(data.answer || 'No answer returned.'), {
          sources: data.sources || [],
          chunks_retrieved: data.chunks_retrieved,
        });
      }
    } catch (err) {
      removeThinking();
      appendMessage('bot', `<span class="error-bubble">Connection failed. Check your API URL and CORS settings.<br><small>${err.message}</small></span>`);
    }

    sendBtn.disabled = false;
    queryInput.focus();
  }
</script>
</body>
</html>
